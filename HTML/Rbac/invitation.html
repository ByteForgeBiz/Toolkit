<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer"><title>Set your TELCO password</title>
<style>
:root{color-scheme:light dark;--bf-bg:#f4f6f9;--bf-panel:#fff;--bf-text:#202b3c;--bf-border:#697586;--bf-action:#1756a9;--bf-action-text:#fff;--bf-muted:#46546a}
@media(prefers-color-scheme:dark){:root{--bf-bg:#141a23;--bf-panel:#202936;--bf-text:#edf2fa;--bf-border:#8c9aae;--bf-action:#9fc6ff;--bf-action-text:#102137;--bf-muted:#becbdd}}
*{box-sizing:border-box}body{margin:0;background:var(--bf-bg);color:var(--bf-text);font:400 1rem/1.5 system-ui,sans-serif}main{max-width:30rem;margin:8vh auto;padding:2rem;background:var(--bf-panel);border:1px solid var(--bf-border);border-radius:.8rem}h1{font-size:1.6rem;margin-top:0;font-weight:700}label{display:block;margin-top:1rem;font-weight:600}input{display:block;width:100%;margin-top:.3rem;padding:.65rem;border:1px solid var(--bf-border);border-radius:.3rem;background:var(--bf-bg);color:var(--bf-text);font:400 1rem system-ui}button{margin-top:1.2rem;padding:.7rem 1rem;background:var(--bf-action);color:var(--bf-action-text);border:1px solid var(--bf-action);border-radius:.3rem;font:600 1rem system-ui;cursor:pointer}button:hover{filter:brightness(.92)}button:disabled{opacity:.6;cursor:wait}:focus-visible{outline:3px solid var(--bf-action);outline-offset:3px}a{color:var(--bf-action)}a:hover{text-decoration-thickness:2px}.bf-help{color:var(--bf-muted)}[hidden]{display:none!important}@media(max-width:34rem){main{margin:1rem;padding:1.25rem}}
</style>
</head>
<body><main id="bf-invitation" data-api="{{API_URL}}" data-mode="{{MODE}}">
<h1 id="bf-invitation-title">Set your TELCO password</h1><p class="bf-help" id="bf-invitation-help">Choose a password of at least 8 characters.</p>
<p class="bf-help" id="bf-shared-credentials">{{CREDENTIAL_NOTICE}}</p>
<p id="bf-invitation-status" role="status" aria-live="polite">Checking your invitation...</p>
<noscript>Enable JavaScript to request a reset link or securely set your password.</noscript>
<form id="bf-reset-request-form" hidden>
<label>Username or email<input name="identifier" type="text" maxlength="254" autocomplete="username" required></label>
<button type="submit">&#128232; Send reset link</button></form>
<form id="bf-invitation-form" hidden>
<label>New password<input name="password" type="password" minlength="8" autocomplete="new-password" required></label>
<label>Confirm password<input name="confirmPassword" type="password" minlength="8" autocomplete="new-password" required></label>
<button type="submit">&#128190; Set password</button></form>
<p><a href="{{LOGIN_URL}}">Return to sign in</a></p>
</main><script>{{SCRIPT}}</script></body></html>
