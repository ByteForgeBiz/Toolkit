<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Portal sign in</title>
<style>:root{color-scheme:light dark}body{font:16px/1.5 system-ui;margin:10vh auto;padding:1.5rem;max-width:32rem}a{color:LinkText}</style></head>
<body><main><h1>Signing you in</h1><p id="status" role="status">Opening your portal…</p><form id="handoff-form" action="PortalHandoff" hidden>{{AntiForgery}}</form><p><a href="Login">Return to sign in</a></p><noscript>JavaScript is required to complete portal sign in.</noscript></main>
<script>
(function(){"use strict";
var token=new URLSearchParams(location.hash.slice(1)).get("portalHandoff");
history.replaceState(null,"",location.pathname);
var form=document.getElementById("handoff-form"),body=new URLSearchParams(new FormData(form));
body.set("token",token||"");
if(!token){document.getElementById("status").textContent="This sign-in link is missing or has expired. Return to sign in.";return;}
fetch(form.action,{method:"POST",credentials:"same-origin",headers:{Accept:"application/json"},body:body,cache:"no-store"})
.then(function(r){return r.json().then(function(data){if(!r.ok)throw new Error(data.message||"This sign-in link is invalid or has expired. Return to sign in.");var url=new URL(data.redirectUrl,location.href);if(url.origin!==location.origin)throw new Error("The portal destination is invalid.");location.replace(url.href);});})
.catch(function(){document.getElementById("status").textContent="This sign-in link is invalid or has expired. Return to sign in.";});
}());
</script></body></html>
